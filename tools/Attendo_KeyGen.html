<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendo License Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl w-full max-w-xl shadow-[0_0_50px_rgba(20,184,166,0.15)] overflow-hidden">
        
        <div class="p-8 border-b border-white/10 bg-black/20 flex flex-col items-center">
            <img src="./public/attendo-icon.png" class="w-16 h-16 mb-4 drop-shadow-xl" alt="Attendo Logo" />
            <h1 class="text-3xl font-black text-teal-400 tracking-tight">Attendo KeyGen</h1>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mt-2">Secure License Authority</p>
        </div>

        <div class="p-8 space-y-6">
            
            <div>
                <label class="text-xs text-gray-400 font-bold uppercase block tracking-widest mb-2">Machine Hardware ID</label>
                <input type="text" id="hwId" placeholder="Paste the customer's Hardware ID here..." class="w-full bg-black/30 border border-white/10 text-white p-4 rounded-xl focus:outline-none focus:border-teal-500 transition-colors font-mono text-sm" />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-gray-400 font-bold uppercase block tracking-widest mb-2">Duration</label>
                    <select id="duration" class="w-full bg-black/30 border border-white/10 text-white p-4 rounded-xl focus:outline-none focus:border-teal-500 transition-colors cursor-pointer appearance-none">
                        <option value="14-days">14-Day Trial</option>
                        <option value="1-month">1-Month Plan (30 Days)</option>
                        <option value="4-months">Semester (4 Months / 120 Days)</option>
                        <option value="12-months" selected>Academic Year (12 Months / 365 Days)</option>
                        <option value="lifetime">Lifetime License (Admin)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-bold uppercase block tracking-widest mb-2">Plan Type</label>
                    <select id="plan" class="w-full bg-black/30 border border-white/10 text-white p-4 rounded-xl focus:outline-none focus:border-teal-500 transition-colors cursor-pointer appearance-none">
                        <option value="trial">Trial</option>
                        <option value="plus">Plus (1 User)</option>
                        <option value="pro">Pro (2-4 Users)</option>
                        <option value="ultimate" selected>Ultimate (5+ Users)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateKey()" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-black py-4 rounded-xl shadow-[0_0_20px_rgba(20,184,166,0.3)] transition-all flex items-center justify-center gap-2 mt-4 text-lg">
                Generate License Token
            </button>

            <div id="resultContainer" class="hidden flex-col gap-4 mt-6 p-6 bg-black/40 border border-teal-500/30 rounded-2xl">
                <p class="text-teal-400 font-bold text-sm">License Token Generated Successfully!</p>
                <p id="expText" class="text-xs text-gray-400 font-bold"></p>
                <textarea id="tokenResult" readonly class="w-full h-32 bg-black/50 border border-white/10 text-gray-300 font-mono text-xs p-4 rounded-xl focus:outline-none resize-none break-all"></textarea>
                <button onclick="copyToken()" id="copyBtn" class="bg-white/10 hover:bg-white/20 text-white font-bold px-6 py-3 rounded-xl transition-all w-full">
                    Copy to Clipboard
                </button>
            </div>

        </div>
    </div>

    <script>
        const SECRET_KEY = "Attendo_Secure_RSA_2026_!@#_Key";

        function base64url(source) {
            let encoded = btoa(source);
            encoded = encoded.replace(/=+$/, '');
            encoded = encoded.replace(/\+/g, '-');
            encoded = encoded.replace(/\//g, '_');
            return encoded;
        }

        function stringToUint8Array(str) {
            return new TextEncoder().encode(str);
        }

        async function signJWT(payload, secret) {
            const header = { alg: "HS256", typ: "JWT" };
            
            const encodedHeader = base64url(unescape(encodeURIComponent(JSON.stringify(header))));
            const encodedPayload = base64url(unescape(encodeURIComponent(JSON.stringify(payload))));
            const dataToSign = `${encodedHeader}.${encodedPayload}`;

            const cryptoKey = await crypto.subtle.importKey(
                "raw",
                stringToUint8Array(secret),
                { name: "HMAC", hash: { name: "SHA-256" } },
                false,
                ["sign"]
            );

            const signature = await crypto.subtle.sign(
                "HMAC",
                cryptoKey,
                stringToUint8Array(dataToSign)
            );

            const signatureArray = Array.from(new Uint8Array(signature));
            const signatureString = String.fromCharCode.apply(null, signatureArray);
            const encodedSignature = base64url(signatureString);

            return `${dataToSign}.${encodedSignature}`;
        }

        async function generateKey() {
            const hwId = document.getElementById('hwId').value.trim();
            const durationVal = document.getElementById('duration').value;
            const plan = document.getElementById('plan').value;

            if (!hwId) {
                alert("Please enter a Machine Hardware ID first.");
                return;
            }

            let expDate = new Date();
            let durationString = "1 Month";
            
            if (durationVal === '14-days') {
                expDate.setDate(expDate.getDate() + 14);
                durationString = "14 Days";
            } else if (durationVal === '1-month') {
                expDate.setDate(expDate.getDate() + 30);
                durationString = "1 Month";
            } else if (durationVal === '4-months') {
                expDate.setDate(expDate.getDate() + 120);
                durationString = "Semester (4 Months)";
            } else if (durationVal === '12-months') {
                expDate.setDate(expDate.getDate() + 365);
                durationString = "Academic Year (12 Months)";
            } else if (durationVal === 'lifetime') {
                expDate.setFullYear(2099, 11, 31);
                durationString = "Lifetime";
            }
            
            expDate.setHours(23, 59, 59, 999);
            const expTimestamp = Math.floor(expDate.getTime() / 1000);

            const payload = {
                hwId: hwId,
                plan: plan,
                duration: durationString,
                exp: expTimestamp
            };

            try {
                const token = await signJWT(payload, SECRET_KEY);
                
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('resultContainer').classList.add('flex');
                document.getElementById('tokenResult').value = token;
                
                document.getElementById('expText').innerText = `Expires: ${expDate.toLocaleString()} (${durationString})`;
                document.getElementById('copyBtn').innerText = "Copy to Clipboard";
                document.getElementById('copyBtn').classList.remove("text-teal-400", "bg-teal-500/20");
            } catch (err) {
                alert("Failed to generate token: " + err.message);
            }
        }

        function copyToken() {
            const tokenText = document.getElementById('tokenResult');
            tokenText.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✓ Copied!";
            btn.classList.add("text-teal-400", "bg-teal-500/20");
        }
    </script>
</body>
</html>
