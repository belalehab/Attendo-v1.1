<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendo Logo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo-container {
            width: 50%;
            max-width: 500px;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Print Settings for PDF Generation */
        @page {
            size: A4 portrait; /* or US Letter */
            margin: 0; 
        }

        @media print {
            body {
                background-color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
        }

        .instructions {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            color: #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    
    <div class="instructions no-print">
        <strong>Export Instructions:</strong><br>
        Press <code>Ctrl + P</code> to print this page and select <strong>"Save as PDF"</strong>.<br>
        Make sure to set margins to "None".
    </div>

    <div class="logo-container">
        <!-- Using absolute path resolution from docs_and_marketing to public -->
        <img src="../public/attendo-icon.png" alt="Attendo Logo">
    </div>

</body>
</html>
